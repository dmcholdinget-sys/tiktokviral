name: Django validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tiktokviral
          POSTGRES_USER: tiktokviral
          POSTGRES_PASSWORD: ci-local-only
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U tiktokviral" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-only-never-use-in-production
      POSTGRES_PASSWORD: ci-local-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test intelligence --noinput
